#  PUBLICATIONS  ·  newest first (within each group)
#
#  Fields (only `title` and `authors` are required):
#    title:    paper title
#    authors:  plain text — "Gabriel Agostini" is bolded automatically.
#              Put * after a name for equal contribution (e.g. "Gabriel Agostini*").
#    venue:    journal / conference, shown in italics   (old files used `journal:` — still works)
#    year:     e.g. 2026
#    pages:    optional, e.g. "1–12"
#    group:    "working" for Working papers; leave out for published work
#    status:   optional label shown before the venue, e.g. "To appear", "Under review" (leave out for none)
#    badges:   optional list, e.g. ["Oral presentation", "Best Paper Award"]
#    paper:    link to the paper — the TITLE becomes this link (no paper = plain title). Old `link:` still works.
#    Other links (all optional, shown as small buttons in this order):
#      project, arxiv, code, data, poster, slides, video, bluesky, twitter
