name: Render cocktail menu covers

# When a menu PDF is added or changed, render its first page to assets/images/menus/<name>.jpg
# (used as the menu's cover on the Fun page), record its size in _data/menu_covers.json, and commit — no manual steps.
on:
  push:
    branches: [master]
    paths:
      - "documents/cocktails/**.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pymupdf pillow

      - run: python scripts/menu_thumbnails.py

      - name: Commit rendered covers
        run: |
          git config user.name "menu-cover-bot"
          git config user.email "bot@github.com"
          git add assets/images/menus _data/menu_covers.json
          git commit -m "Render cocktail menu covers" || exit 0
          git push
