name: Update Goodreads Books

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fetch_goodreads.py
      - name: Commit updated books
        run: |
          if git diff --quiet -- _data/goodreads_books.json; then
            echo "No Goodreads changes"
            exit 0
          fi
          git config user.name "goodreads-bot"
          git config user.email "bot@github.com"
          git add _data/goodreads_books.json
          git commit -m "Update Goodreads books"
          git push
